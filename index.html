/*
  Scoring system:
  Each answer carries a weight for [waterfall, agile, hybrid].
  We sum across all questions, then normalize to percentages.
  The highest score wins the recommendation.
*/
const QUESTIONS = [
  {
    id: "requirements",
    text: "How clear and stable are your project requirements?",

    ],
  },
  {

    text: "How quickly do you need to deliver value to stakeholders?",
    subtitle: "Do stakeholders need to see results in weeks, or can they wait for a complete deliverable?",
    options: [
      { label: "We deliver everything at the end — that's expected and acceptable", weights: [3, 0, 1] },
      { label: "We can wait for most of it, but want some early milestones", weights: [2, 1, 2] },
      { label: "We need working increments every few weeks", weights: [0, 2, 2] },
      { label: "We need continuous delivery and rapid feedback loops", weights: [0, 3, 0] },
    ],
  },
  {
    id: "stakeholder-involvement",
    text: "How involved are stakeholders/customers during the work?",
    subtitle: "Will clients review progress regularly, or do they prefer to see the final result?",
    options: [
      { label: "Minimal — they review the final deliverable only", weights: [3, 0, 1] },
      { label: "Occasional — milestone reviews a few times", weights: [2, 1, 2] },
      { label: "Frequent — they're involved in sprint reviews or demos", weights: [0, 2, 2] },
      { label: "Continuous — they're practically part of the team", weights: [0, 3, 0] },
    ],
  },
  {
    id: "team-size",
    text: "How large and distributed is your team?",
    subtitle: "Team size and location affect communication overhead and process needs.",
    options: [
      { label: "Large (20+) and/or highly distributed across time zones", weights: [2, 0, 2] },
      { label: "Medium (10–20), partially distributed", weights: [1, 1, 3] },
      { label: "Small (5–10), mostly co-located", weights: [0, 2, 2] },
      { label: "Very small (2–5), tight-knit and co-located", weights: [0, 3, 0] },
    ],
  },
  {
    id: "upfront-planning",
    text: "How structured does your planning need to be upfront?",
    subtitle: "Some projects need a full plan before work starts; others plan as they go.",
    options: [
      { label: "Comprehensive upfront plan is required (e.g. regulatory, contracts)", weights: [3, 0, 1] },
      { label: "Solid upfront plan with room to adjust", weights: [2, 1, 2] },
      { label: "High-level plan upfront; details emerge during execution", weights: [0, 2, 2] },
      { label: "Minimal upfront planning — we adapt each cycle", weights: [0, 3, 0] },
    ],
  },
];

/* ============================================================
   SCORING ENGINE
   ============================================================ */

function computeScores(answers) {
  // answers: { questionId: optionIndex }
  let wf = 0, ag = 0, hy = 0;

  QUESTIONS.forEach(q => {
    const idx = answers[q.id];
    if (idx === undefined) return;
    const [w, a, h] = q.options[idx].weights;
    wf += w; ag += a; hy += h;
  });

  const total = wf + ag + hy || 1;
  const pct = {
    waterfall: Math.round((wf / total) * 100),
    agile: Math.round((ag / total) * 100),
    hybrid: Math.round((hy / total) * 100),
  };

  // Normalize so they sum to 100
  const diff = 100 - (pct.waterfall + pct.agile + pct.hybrid);
  const top = Object.entries(pct).sort((a, b) => b[1] - a[1])[0][0];
  pct[top] += diff;

  const recommended = Object.entries(pct).sort((a, b) => b[1] - a[1])[0][0];

  return { scores: pct, recommended };
}

          )}

          {/* Key docs */}
          {concept.docs && (
            <div className="space-y-2">
              {concept.docs.map((d, i) => (
                <div key={i} className="border border-slate-200 rounded-xl p-3">
                  <div className="font-semibold text-sm text-slate-900 mb-1">📄 {d.name}</div>
                  <p className="text-xs text-slate-600">{d.desc}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

function LearnSection() {
  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <div className="text-center mb-8">
        <h1 className="text-3xl font-bold text-slate-900 mb-2">Project Management Fundamentals</h1>
        <p className="text-slate-500 text-lg">Tap any card to expand and dive deeper into each topic.</p>
      </div>
      <div className="space-y-3">
        {PM_CONCEPTS.map(c => <ConceptCard key={c.id} concept={c} />)}
      </div>
      <div className="mt-10 text-center">
        <p className="text-slate-500 text-sm mb-3">Ready to find the right methodology for your team?</p>
        <button
          className="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 transition-colors shadow-sm"
          onClick={() => document.querySelector('[data-tab="assess"]')?.click()}
        >
          Take the Assessment →
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   COMPONENTS — Assessment
   ============================================================ */

function ProgressBar({ current, total }) {
  const pct = Math.round((current / total) * 100);
  return (
    <div className="mb-6">
      <div className="flex justify-between text-xs text-slate-500 mb-1">
        <span>Question {current} of {total}</span>
        <span>{pct}% complete</span>
      </div>
      <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
        <div
          className="h-full bg-blue-600 rounded-full progress-bar"
          style={{ width: `${pct}%` }}
        />
      </div>
    </div>
  );
}

function AssessmentStep({ question, answer, onAnswer, onBack, onNext, stepIdx, total }) {
  return (
    <div className="fade-in">
      <ProgressBar current={stepIdx + 1} total={total} />
      <Card className="p-6">
        <div className="mb-1">
          <Badge color="blue">Question {stepIdx + 1}</Badge>
        </div>
        <h2 className="text-xl font-bold text-slate-900 mt-2 mb-1">{question.text}</h2>
        <p className="text-slate-500 text-sm mb-6">{question.subtitle}</p>
        <div className="space-y-3">
          {question.options.map((opt, i) => (
            <button
              key={i}
              onClick={() => onAnswer(i)}
              className={`w-full text-left p-4 rounded-xl border-2 transition-all text-sm font-medium ${
                answer === i
                  ? "border-blue-500 bg-blue-50 text-blue-900"
                  : "border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700"
              }`}
            >
              <span className={`inline-block w-6 h-6 rounded-full border-2 mr-3 text-center text-xs leading-5 flex-shrink-0 ${
                answer === i ? "border-blue-500 bg-blue-500 text-white" : "border-slate-300"
              }`} style={{display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                {answer === i ? "✓" : String.fromCharCode(65 + i)}
              </span>
              {opt.label}
            </button>
          ))}
        </div>
      </Card>
      <div className="flex justify-between mt-4">
        <button
          onClick={onBack}
          disabled={stepIdx === 0}
          className="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"
        >
          ← Back
        </button>
        <button
          onClick={onNext}
          disabled={answer === undefined}
          className="px-6 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >
          {stepIdx === total - 1 ? "See My Results →" : "Next →"}
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   COMPONENTS — Results
   ============================================================ */

function ScoreBar({ label, pct, color, isTop }) {
  const colorMap = {
    blue: { bar: "bg-blue-500", text: "text-blue-700" },
    green: { bar: "bg-green-500", text: "text-green-700" },
    purple: { bar: "bg-purple-500", text: "text-purple-700" },
  };
  const c = colorMap[color] || colorMap.blue;
  return (
    <div className="mb-3">
      <div className="flex justify-between items-center mb-1">
        <span className={`text-sm font-medium ${isTop ? c.text : "text-slate-600"}`}>
          {isTop ? "★ " : ""}{label}
        </span>
        <span className={`text-sm font-bold ${isTop ? c.text : "text-slate-500"}`}>{pct}%</span>
      </div>
      <div className="h-3 bg-slate-100 rounded-full overflow-hidden">
        <div
          className={`h-full rounded-full progress-bar ${isTop ? c.bar : "bg-slate-300"}`}
          style={{ width: `${pct}%` }}
        />
      </div>
    </div>
  );
}

function ResultsScreen({ scores, recommended, answers, onRetake }) {
  const detail = METHODOLOGY_DETAILS[recommended];
  const colorMap = {
    blue: { header: "bg-blue-600", badge: "bg-blue-100 text-blue-800", ring: "ring-blue-300" },
    green: { header: "bg-green-600", badge: "bg-green-100 text-green-800", ring: "ring-green-300" },
    purple: { header: "bg-purple-600", badge: "bg-purple-100 text-purple-800", ring: "ring-purple-300" },
  };
  const c = colorMap[detail.color] || colorMap.blue;

  const methodColors = { waterfall: "blue", agile: "green", hybrid: "purple" };

  return (
    <div className="fade-in space-y-5">
      {/* Hero result card */}
      <Card className={`overflow-hidden`}>
        <div className={`${c.header} p-6 text-white`}>
          <div className="text-5xl mb-2">{detail.icon}</div>
          <div className="text-sm font-medium opacity-80 mb-1">Your Recommended Methodology</div>
          <h2 className="text-3xl font-bold mb-1">{detail.name}</h2>
          <p className="opacity-90 text-sm">{detail.tagline}</p>
        </div>
        <div className="p-6">
          <h3 className="font-semibold text-slate-900 mb-2">Why this fits you</h3>
          <p className="text-slate-600 text-sm leading-relaxed">{detail.why}</p>
        </div>
      </Card>

      {/* Confidence breakdown */}
      <Card className="p-5">
        <h3 className="font-semibold text-slate-900 mb-1">Confidence Breakdown</h3>
        <p className="text-xs text-slate-500 mb-4">Based on your 7 answers — scores reflect how well each methodology matches your context.</p>
        <ScoreBar label="Waterfall" pct={scores.waterfall} color="blue" isTop={recommended === "waterfall"} />
        <ScoreBar label="Agile" pct={scores.agile} color="green" isTop={recommended === "agile"} />
        <ScoreBar label="Hybrid" pct={scores.hybrid} color="purple" isTop={recommended === "hybrid"} />
      </Card>

      {/* Key characteristics */}
      <Card className="p-5">
        <h3 className="font-semibold text-slate-900 mb-3">Key Characteristics</h3>
        <ul className="space-y-2">
          {detail.characteristics.map((ch, i) => (
            <li key={i} className="flex items-start gap-2 text-sm text-slate-700">
              <span className="text-blue-500 mt-0.5 flex-shrink-0">✓</span>
              <span>{ch}</span>
            </li>
          ))}
        </ul>
        <div className="mt-4 p-3 bg-slate-50 rounded-xl">
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Best For</div>
          <p className="text-sm text-slate-700">{detail.bestFor}</p>
        </div>
      </Card>

      {/* Next steps */}
      <Card className="p-5">
        <h3 className="font-semibold text-slate-900 mb-3">🚀 Your Next Steps</h3>
        <ol className="space-y-3">
          {detail.nextSteps.map((step, i) => (
            <li key={i} className="flex items-start gap-3">
              <span className={`flex-shrink-0 w-6 h-6 rounded-full ${c.header} text-white text-xs font-bold flex items-center justify-center`}>{i + 1}</span>
              <p className="text-sm text-slate-700 leading-relaxed">{step}</p>
            </li>
          ))}
        </ol>
      </Card>

      {/* Org structure suggestion */}
      <Card className="p-5 border-l-4 border-l-amber-400">
        <div className="flex items-start gap-3">
          <span className="text-2xl">🏗️</span>
          <div>
            <h3 className="font-semibold text-slate-900 mb-1">Organizational Structure Suggestion</h3>
            <p className="text-sm text-slate-600">{detail.orgSuggestion}</p>
          </div>
        </div>
      </Card>

      {/* Retake */}
      <div className="text-center pt-2 pb-8">
        <button
          onClick={onRetake}
          className="px-6 py-3 border-2 border-slate-300 rounded-xl text-slate-700 font-semibold hover:border-slate-400 hover:bg-slate-50 transition-colors text-sm"
        >
          ↺ Retake Assessment
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   COMPONENTS — Assessment Container
   ============================================================ */

function AssessSection() {
  const [step, setStep] = useState("intro"); // "intro" | number | "results"
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);

  const startAssessment = () => setStep(0);

  const handleAnswer = (questionId, optIdx) => {
    setAnswers(prev => ({ ...prev, [questionId]: optIdx }));
  };

  const handleNext = () => {
    if (step < QUESTIONS.length - 1) {
      setStep(s => s + 1);
    } else {
      // Compute results
      const { scores, recommended } = computeScores(answers);
      setResult({ scores, recommended });
      setStep("results");
    }
  };

  const handleBack = () => {
    if (step > 0) setStep(s => s - 1);
  };

  const retake = () => {
    setAnswers({});
    setResult(null);
    setStep("intro");
  };

  if (step === "results" && result) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <ResultsScreen
          scores={result.scores}
          recommended={result.recommended}
          answers={answers}
          onRetake={retake}
        />
      </div>
    );
  }

  if (step === "intro") {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <div className="text-center mb-8">
          <div className="text-6xl mb-4">🧭</div>
          <h1 className="text-3xl font-bold text-slate-900 mb-3">Find Your Method</h1>
          <p className="text-slate-500 text-lg max-w-md mx-auto">
            Answer 7 quick questions about your company and projects. We'll recommend the best project management methodology — and explain why.
          </p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
          {[
            { icon: "💧", name: "Waterfall", desc: "Sequential, plan-driven" },
            { icon: "🔁", name: "Agile", desc: "Iterative, flexible" },
            { icon: "🔀", name: "Hybrid", desc: "Best of both" },
          ].map(m => (
            <Card key={m.name} className="p-4 text-center">
              <div className="text-3xl mb-1">{m.icon}</div>
              <div className="font-semibold text-slate-900 text-sm">{m.name}</div>
              <div className="text-xs text-slate-500">{m.desc}</div>
            </Card>
          ))}
        </div>
        <div className="text-center">
          <button
            onClick={startAssessment}
            className="bg-blue-600 text-white px-8 py-4 rounded-xl font-semibold text-lg hover:bg-blue-700 transition-colors shadow-sm"
          >
            Start Assessment →
          </button>
          <p className="text-xs text-slate-400 mt-3">Takes about 2 minutes · No account required</p>
        </div>
      </div>
    );
  }

  // Question step
  const question = QUESTIONS[step];
  return (
    <div className="max-w-2xl mx-auto px-4 py-8">
      <AssessmentStep
        question={question}
        answer={answers[question.id]}
        onAnswer={idx => handleAnswer(question.id, idx)}
        onBack={handleBack}
        onNext={handleNext}
        stepIdx={step}
        total={QUESTIONS.length}
      />
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */

function App() {
  const [activeTab, setActiveTab] = useState("learn");

  return (
    <div className="min-h-screen bg-slate-50">
      <Nav activeTab={activeTab} setActiveTab={setActiveTab} />

      {/* Hidden buttons for cross-tab navigation */}
      <button data-tab="assess" onClick={() => setActiveTab("assess")} className="hidden" />

      <main>
        {activeTab === "learn" ? <LearnSection /> : <AssessSection />}
      </main>

      <footer className="border-t border-slate-200 bg-white mt-8 py-6 text-center text-xs text-slate-400">
        PM Compass · Built on standard PM foundations (PMI/PMBOK, Agile Manifesto) · For educational use
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
