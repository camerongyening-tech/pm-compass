/* ============================================================
   SCORING ENGINE
   ============================================================ */

function computeScores(answers) {
  // answers: { questionId: optionIndex }
  let wf = 0, ag = 0, hy = 0;

  QUESTIONS.forEach(q => {
    const idx = answers[q.id];
    if (idx === undefined) return;
    const [w, a, h] = q.options[idx].weights;
    wf += w; ag += a; hy += h;
  });

  const total = wf + ag + hy || 1;
  const pct = {
    waterfall: Math.round((wf / total) * 100),
    agile: Math.round((ag / total) * 100),
    hybrid: Math.round((hy / total) * 100),
  };

  // Normalize so they sum to 100
  const diff = 100 - (pct.waterfall + pct.agile + pct.hybrid);
  const top = Object.entries(pct).sort((a, b) => b[1] - a[1])[0][0];
  pct[top] += diff;

  const recommended = Object.entries(pct).sort((a, b) => b[1] - a[1])[0][0];

  return { scores: pct, recommended };
}

function ProgressBar({ current, total }) {
  const pct = Math.round((current / total) * 100);
  return (
    <div className="mb-6">
      <div className="flex justify-between text-xs text-slate-500 mb-1">
        <span>Question {current} of {total}</span>
        <span>{pct}% complete</span>
      </div>
      <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
        <div
          className="h-full bg-blue-600 rounded-full progress-bar"
          style={{ width: `${pct}%` }}
        />
      </div>
    </div>
  );
}

function AssessmentStep({ question, answer, onAnswer, onBack, onNext, stepIdx, total }) {
  return (
    <div className="fade-in">
      <ProgressBar current={stepIdx + 1} total={total} />
      <Card className="p-6">
        <div className="mb-1">
          <Badge color="blue">Question {stepIdx + 1}</Badge>
        </div>
        <h2 className="text-xl font-bold text-slate-900 mt-2 mb-1">{question.text}</h2>
        <p className="text-slate-500 text-sm mb-6">{question.subtitle}</p>
        <div className="space-y-3">
          {question.options.map((opt, i) => (
            <button
              key={i}
              onClick={() => onAnswer(i)}
              className={`w-full text-left p-4 rounded-xl border-2 transition-all text-sm font-medium ${
                answer === i
                  ? "border-blue-500 bg-blue-50 text-blue-900"
                  : "border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700"
              }`}
            >
              <span className={`inline-block w-6 h-6 rounded-full border-2 mr-3 text-center text-xs leading-5 flex-shrink-0 ${
                answer === i ? "border-blue-500 bg-blue-500 text-white" : "border-slate-300"
              }`} style={{display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                {answer === i ? "✓" : String.fromCharCode(65 + i)}
              </span>
              {opt.label}
            </button>
          ))}
        </div>
      </Card>
      <div className="flex justify-between mt-4">
        <button
          onClick={onBack}
          disabled={stepIdx === 0}
          className="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"
        >
          ← Back
        </button>
        <button
          onClick={onNext}
          disabled={answer === undefined}
          className="px-6 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >
          {stepIdx === total - 1 ? "See My Results →" : "Next →"}
        </button>
      </div>
    </div>
  );
}

function analyzeCharter(data, recommended) {
  const get = key => (data[key] || "").trim();
  const lines = str => str.split("\n").map(s => s.trim()).filter(Boolean);
  const strengths = [];
  const gaps = [];

  const objectives = get("objectives");
  const hasMeasurable = /\d/.test(objectives) || /%|percent/i.test(objectives);
  const hasTimebound = /\b(by|before|within|deadline|due|q[1-4]|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|\d{4})\b/i.test(objectives);
  if (hasMeasurable && hasTimebound) {
    strengths.push({ title: "Objectives are measurable and time-bound", detail: "Your objectives include numbers or dates, giving the team a clear target and deadline to work toward." });
  } else {
    gaps.push({ key: "objectivesSmart", title: "Objectives may not be fully SMART", detail: "Add specific numbers, percentages, or deadlines so it's obvious when you've succeeded." });
  }

  if (get("sponsor")) {
    strengths.push({ title: "Sponsor identified", detail: "A named sponsor gives the project authority to resolve roadblocks and secure resources." });
  } else {
    gaps.push({ key: "sponsor", title: "No sponsor named", detail: "Without an accountable executive sponsor, the project may struggle to get funding or escalate blockers." });
  }

  const inScope = get("inScope");
  const outScope = get("outScope");
  if (inScope && outScope) {
    strengths.push({ title: "Scope boundaries are clear", detail: "You've defined both what's included and excluded — one of the strongest defenses against scope creep." });
  } else if (inScope && !outScope) {
    gaps.push({ key: "scope", title: "Out-of-scope isn't defined", detail: "You've said what's included, but not what's excluded. Undefined boundaries are a common source of scope creep." });
  } else {
    gaps.push({ key: "scope", title: "No scope defined", detail: "Without in-scope/out-of-scope boundaries, the team and stakeholders may disagree about what this project actually covers." });
  }

  if (get("stakeholders")) {
    const count = lines(get("stakeholders")).length;
    strengths.push({ title: `${count} stakeholder${count === 1 ? "" : "s"} identified`, detail: "Naming stakeholders early helps you plan communication and avoid late surprises." });
  } else {
    gaps.push({ key: "stakeholders", title: "No stakeholders listed", detail: "Unidentified stakeholders are one of the most common reasons projects run into resistance or missed requirements." });
  }

  if (get("budget")) {
    strengths.push({ title: "Budget captured", detail: "A budget baseline lets you track whether the project stays financially on track." });
  } else {
    gaps.push({ key: "budget", title: "No budget captured", detail: "Without an estimate, you won't be able to tell if the project is over or under budget as it progresses." });
  }

  const milestones = get("milestones");
  if (milestones) {
    const msLines = lines(milestones);
    const hasDates = /\d{1,4}[-\/]\d{1,2}|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|q[1-4]|\d{4})\b/i.test(milestones);
    if (hasDates) {
      strengths.push({ title: "Milestones have target dates", detail: "Dated milestones give you concrete checkpoints to measure progress against." });
    } else {
      gaps.push({ key: "milestones", title: "Milestones are missing target dates", detail: "You've listed milestones, but without dates it's hard to know if you're on schedule." });
    }
    if (recommended === "waterfall" && msLines.length < 3) {
      gaps.push({ key: "waterfallMilestones", title: "Few phase-gate milestones for a Waterfall project", detail: "Waterfall projects typically track multiple phase gates (requirements, design, build, test, deploy). Consider adding more." });
    }
  } else {
    gaps.push({ key: "milestones", title: "No milestones listed", detail: "Without checkpoints, it's hard to tell if the project is progressing on schedule." });
  }

  if (get("assumptions")) {
    strengths.push({ title: "Assumptions documented", detail: "Writing down assumptions makes it easier to catch them if they turn out to be false." });
  } else {
    gaps.push({ key: "assumptions", title: "No assumptions documented", detail: "Unstated assumptions often turn into unpleasant surprises mid-project." });
  }

  if (get("constraints")) {
    strengths.push({ title: "Constraints captured", detail: "Known limits (budget, deadlines, compliance) keep planning realistic." });
  } else {
    gaps.push({ key: "constraints", title: "No constraints captured", detail: "Without documented limits, plans may be built on unrealistic assumptions about time, budget, or resources." });
  }

  if (get("risks")) {
    strengths.push({ title: "Risks identified", detail: "Naming risks up front means the team can plan responses instead of reacting under pressure." });
  } else {
    gaps.push({ key: "risks", title: "No risks identified", detail: "Every project carries risk — skipping this section usually means risks get discovered the hard way, mid-project." });
  }

  if (get("successCriteria")) {
    strengths.push({ title: "Success criteria defined", detail: "A clear definition of \"done\" makes it obvious when the project has actually succeeded." });
  } else {
    gaps.push({ key: "successCriteria", title: "No success criteria defined", detail: "Without a definition of done, it's hard to know when to close the project — or whether it delivered value." });
  }

  if (recommended === "agile" && lines(inScope).length > 6) {
    gaps.push({ key: "agileScope", title: "Scope may be too detailed for Agile", detail: "You've listed a lot of fixed scope items. Consider keeping the charter high-level and letting your backlog absorb the details, so scope can adapt." });
  }

  const total = strengths.length + gaps.length;
  const score = total === 0 ? 0 : Math.round((strengths.length / total) * 100);

  let verdict, verdictColor;
  if (score >= 80) { verdict = "Likely to Work Well"; verdictColor = "green"; }
  else if (score >= 50) { verdict = "On the Right Track — a Few Gaps"; verdictColor = "amber"; }
  else { verdict = "High Risk — Key Pieces Missing"; verdictColor = "red"; }

  return { score, verdict, verdictColor, strengths, gaps };
}

function assessViability(data) {
  const get = key => (data[key] || "").trim();
  const milestones = get("milestones");
  const hasMilestoneDates = /\d{1,4}[-\/]\d{1,2}|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|q[1-4]|\d{4})\b/i.test(milestones);

  const kickoffChecks = [
    { label: "Sponsor named", pass: !!get("sponsor") },
    { label: "Budget captured", pass: !!get("budget") },
    { label: "Stakeholders identified", pass: !!get("stakeholders") },
    { label: "Scope defined", pass: !!get("inScope") },
    { label: "Milestones set", pass: !!milestones },
  ];

  const trackChecks = [
    { label: "Risks identified", pass: !!get("risks") },
    { label: "Assumptions documented", pass: !!get("assumptions") },
    { label: "Constraints captured", pass: !!get("constraints") },
    { label: "Success criteria defined", pass: !!get("successCriteria") },
    { label: "Milestones have dates", pass: hasMilestoneDates },
  ];

  const pct = checks => Math.round((checks.filter(c => c.pass).length / checks.length) * 100);
  const readiness = pct(kickoffChecks);
  const durability = pct(trackChecks);

  let verdict, verdictColor, summary;
  if (readiness >= 60 && durability >= 60) {
    verdict = "Active — Ready to Launch";
    verdictColor = "green";
    summary = "This charter has what it needs to kick off now, plus the risk and planning groundwork to keep moving once it's underway.";
  } else if (readiness >= 60 && durability < 60) {
    verdict = "Ready to Launch, at Risk of Stalling";
    verdictColor = "amber";
    summary = "You can start this project, but thin risk planning, assumptions, or success criteria mean it may lose momentum partway through.";
  } else if (readiness < 60 && durability >= 60) {
    verdict = "Well-Planned, Not Yet Ready to Launch";
    verdictColor = "amber";
    summary = "The long-term thinking is solid, but core launch pieces — sponsor, budget, scope, or milestones — are still missing.";
  } else {
    verdict = "Not Yet Active";
    verdictColor = "red";
    summary = "This charter isn't ready to start and doesn't yet show the planning needed to stay on track. Fill in more sections before kicking off.";
  }

  return { readiness, durability, verdict, verdictColor, summary, kickoffChecks, trackChecks };
}

function AssessSection() {
  const [step, setStep] = useState("intro"); // "intro" | number | "results" | "charter" | "scopePlan" | one of PLAN_ORDER
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);
  const [scopeTitle, setScopeTitle] = useState("");

  const startAssessment = () => setStep(0);

  const handleAnswer = (questionId, optIdx) => {
    setAnswers(prev => ({ ...prev, [questionId]: optIdx }));
  };

  const handleNext = () => {
    if (step < QUESTIONS.length - 1) {
      setStep(s => s + 1);
    } else {
      // Compute results
      const { scores, recommended } = computeScores(answers);
      setResult({ scores, recommended });
      setStep("results");
    }
  };

  const handleBack = () => {
    if (step > 0) setStep(s => s - 1);
  };

  const retake = () => {
    setAnswers({});
    setResult(null);
    setStep("intro");
  };

  if (step === "results" && result) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <ResultsScreen
          scores={result.scores}
          recommended={result.recommended}
          answers={answers}
          onRetake={retake}
          onSelectDocument={(key) => setStep(key)}
        />
      </div>
    );
  }

  if (step === "hub" && result) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <DocumentHub
          onSelect={(key) => setStep(key)}
          onBack={() => setStep("results")}
        />
      </div>
    );
  }

  if (step === "charter" && result) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <CharterBuilder
          recommended={result.recommended}
          detail={METHODOLOGY_DETAILS[result.recommended]}
          onBack={() => setStep("hub")}
          onBuildScopePlan={(title) => { setScopeTitle(title); setStep("scopePlan"); }}
        />
      </div>
    );
  }

  if (step === "scopePlan" && result) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <ScopePlanBuilder
          recommended={result.recommended}
          detail={METHODOLOGY_DETAILS[result.recommended]}
          projectTitle={scopeTitle}
          onBack={() => setStep("hub")}
          onNext={(title) => { setScopeTitle(title); setStep(PLAN_ORDER[0]); }}
        />
      </div>
    );
  }

  if (PLAN_ORDER.includes(step) && result) {
    const planType = PLAN_TYPES.find(p => p.key === step);
    const idx = PLAN_ORDER.indexOf(step);
    const nextPlanType = idx < PLAN_ORDER.length - 1 ? PLAN_TYPES.find(p => p.key === PLAN_ORDER[idx + 1]) : null;
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <PlanBuilder
          planType={planType}
          recommended={result.recommended}
          detail={METHODOLOGY_DETAILS[result.recommended]}
          projectTitle={scopeTitle}
          onBack={() => setStep("hub")}
          onNext={nextPlanType ? (title) => { setScopeTitle(title); setStep(nextPlanType.key); } : null}
          nextLabel={nextPlanType ? `Build Your ${nextPlanType.docLabel}` : null}
        />
      </div>
    );
  }

  if (step === "intro") {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <div className="text-center mb-8">
          <CompassLogo className="w-16 h-16 mx-auto mb-4" />
          <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 mb-3 tracking-tight leading-[1.05]">Find Your Method</h1>
          <p className="text-slate-500 text-lg max-w-md mx-auto">
            Answer 7 quick questions about your company and projects. We'll recommend the best project management methodology — and explain why.
          </p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
          {[
            { name: "Waterfall", desc: "Sequential, plan-driven" },
            { name: "Agile", desc: "Iterative, flexible" },
            { name: "Hybrid", desc: "Best of both" },
          ].map(m => (
            <Card key={m.name} className="p-4 text-center">
              <div className="font-semibold text-slate-900 text-sm">{m.name}</div>
              <div className="text-xs text-slate-500">{m.desc}</div>
            </Card>
          ))}
        </div>
        <div className="text-center">
          <button
            onClick={startAssessment}
            className="bg-blue-600 text-white px-8 py-4 rounded-xl font-semibold text-lg hover:bg-blue-700 transition-colors shadow-sm"
          >
            Start Assessment →
          </button>
          <p className="text-xs text-slate-400 mt-3">Takes about 2 minutes · No account required</p>
        </div>
      </div>
    );
  }

  // Question step
  const question = QUESTIONS[step];
  return (
    <div className="max-w-2xl mx-auto px-4 py-8">
      <AssessmentStep
        question={question}
        answer={answers[question.id]}
        onAnswer={idx => handleAnswer(question.id, idx)}
        onBack={handleBack}
        onNext={handleNext}
        stepIdx={step}
        total={QUESTIONS.length}
      />
    </div>
  );
}
